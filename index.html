<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shanghai Trip Planner 🇨🇳</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --text-main: #0F172A;
      --text-sub: #64748B;
      --primary: #E11D48;
      --primary-light: #FFE4E6;
      --border: #E2E8F0;
      --radius: 16px;
      --danger: #EF4444;
      --success: #10B981;
      --amap-blue: #0284C7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Prompt', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text-main); padding-bottom: 90px; }

    header {
      background: #FFFFFF;
      padding: 16px 20px 12px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-top { display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.25rem; font-weight: 700; color: var(--primary); }
    .btn-config { background: none; border: none; font-size: 1.2rem; cursor: pointer; }

    /* Day Tabs */
    .day-tabs { display: flex; gap: 8px; overflow-x: auto; padding: 12px 20px; scrollbar-width: none; }
    .day-tabs::-webkit-scrollbar { display: none; }
    .day-btn {
      flex-shrink: 0; background: #FFFFFF; border: 1px solid var(--border); color: var(--text-sub);
      padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 500; cursor: pointer;
    }
    .day-btn.active { background: var(--primary); color: #FFFFFF; border-color: var(--primary); }

    .container { padding: 0 20px; }
    .section-slot { margin-top: 16px; margin-bottom: 8px; font-size: 0.9rem; font-weight: 600; color: var(--text-sub); }

    /* Place Card */
    .place-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
      position: relative;
      transition: all 0.2s;
    }
    .place-card.is-done {
      background: #F1F5F9;
      opacity: 0.65;
    }
    .place-card.is-done .place-name {
      text-decoration: line-through;
      color: var(--text-sub);
    }

    .place-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 4px; }
    .place-name { font-size: 1.05rem; font-weight: 600; }
    .badge-user { font-size: 0.7rem; background: var(--primary-light); color: var(--primary); padding: 2px 8px; border-radius: 12px; font-weight: 500; }

    /* Chinese Name & Copy */
    .chinese-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #FEF2F2;
      border: 1px solid #FECACA;
      color: #991B1B;
      font-size: 0.8rem;
      padding: 3px 8px;
      border-radius: 6px;
      margin-bottom: 8px;
      cursor: pointer;
      font-weight: 500;
    }
    .chinese-tag:hover { background: #FEE2E2; }

    /* Metro Station info */
    .metro-info {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: #0369A1;
      background: #E0F2FE;
      padding: 4px 8px;
      border-radius: 6px;
      margin-bottom: 8px;
      width: fit-content;
      font-weight: 500;
    }

    .place-note { font-size: 0.85rem; color: var(--text-sub); margin-bottom: 12px; line-height: 1.4; }

    /* Action Buttons */
    .place-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .btn-act {
      padding: 7px 11px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 500;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: none;
      cursor: pointer;
    }
    .btn-gmap { background: #F1F5F9; color: #1E293B; }
    .btn-amap { background: #E0F2FE; color: var(--amap-blue); }
    .btn-edit { background: #FEF3C7; color: #D97706; }
    .btn-delete { background: #FEE2E2; color: var(--danger); }
    .btn-check {
      background: #DCFCE7; color: #15803D; margin-left: auto; font-weight: 600;
    }
    .place-card.is-done .btn-check {
      background: #CBD5E1; color: #475569;
    }

    /* FAB */
    .fab {
      position: fixed; bottom: 24px; right: 20px;
      background: var(--primary); color: #FFFFFF; border: none;
      padding: 14px 20px; border-radius: 30px; font-size: 0.95rem; font-weight: 600;
      box-shadow: 0 4px 16px rgba(225, 29, 72, 0.35); cursor: pointer; z-index: 20;
    }

    /* Modal */
    .modal {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5); display: none; align-items: flex-end; z-index: 100;
    }
    .modal-content {
      background: #FFFFFF; width: 100%; border-radius: 24px 24px 0 0;
      padding: 20px; max-height: 88vh; overflow-y: auto;
    }
    .modal-title { font-size: 1.15rem; font-weight: 600; margin-bottom: 14px; }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--text-sub); margin-bottom: 4px; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.9rem; outline: none;
    }
    .btn-submit {
      width: 100%; padding: 13px; background: var(--primary); color: #FFFFFF; border: none;
      border-radius: 10px; font-size: 0.95rem; font-weight: 600; margin-top: 8px; cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <div>
        <h1>Shanghai 2026 🇨🇳</h1>
        <div style="font-size: 0.75rem; color: var(--text-sub);">Itinerary, Metro & China Maps</div>
      </div>
      <button class="btn-config" onclick="openConfigModal()">⚙️</button>
    </div>
  </header>

  <div class="day-tabs">
    <button class="day-btn active" onclick="filterDay('All', this)">ทั้งหมด</button>
    <button class="day-btn" onclick="filterDay('Day 1', this)">Day 1</button>
    <button class="day-btn" onclick="filterDay('Day 2', this)">Day 2</button>
    <button class="day-btn" onclick="filterDay('Day 3', this)">Day 3</button>
    <button class="day-btn" onclick="filterDay('Day 4', this)">Day 4</button>
    <button class="day-btn" onclick="filterDay('Day 5', this)">Day 5</button>
  </div>

  <div class="container" id="placesList">
    <div style="text-align: center; color: var(--text-sub); padding: 40px 0;">กำลังโหลดแผนการเดินทาง...</div>
  </div>

  <button class="fab" onclick="openAddModal()">+ เพิ่มสถานที่</button>

  <!-- Modal: Add / Edit -->
  <div class="modal" id="entryModal">
    <div class="modal-content">
      <div class="modal-title" id="modalHeading">เพิ่มสถานที่เที่ยวเซี่ยงไฮ้</div>
      <input type="hidden" id="editRowIndex" value="">
      
      <div class="form-group">
        <label>วันที่</label>
        <select id="inputDay">
          <option value="Day 1">Day 1</option>
          <option value="Day 2">Day 2</option>
          <option value="Day 3">Day 3</option>
          <option value="Day 4">Day 4</option>
          <option value="Day 5">Day 5</option>
        </select>
      </div>
      <div class="form-group">
        <label>ช่วงเวลา</label>
        <select id="inputSlot">
          <option value="ช่วงเช้า (Morning)">ช่วงเช้า (Morning)</option>
          <option value="ช่วงบ่าย (Afternoon)">ช่วงบ่าย (Afternoon)</option>
          <option value="ช่วงค่ำ (Evening)">ช่วงค่ำ (Evening)</option>
        </select>
      </div>
      <div class="form-group">
        <label>ชื่อสถานที่ (ไทย / อังกฤษ)</label>
        <input type="text" id="inputName" placeholder="เช่น The Bund, สวนอวี้หยวน">
      </div>
      <div class="form-group">
        <label>ชื่อภาษาจีน (สำหรับเรียก Didi / แผนที่จีน)</label>
        <input type="text" id="inputChinese" placeholder="เช่น 外滩, 豫园, 东方明珠">
      </div>
      <div class="form-group">
        <label>สถานีรถไฟฟ้าใต้ดิน & ทางออก (Metro Exit)</label>
        <input type="text" id="inputMetro" placeholder="เช่น Line 2/10 - East Nanjing Rd. (Exit 7)">
      </div>
      <div class="form-group">
        <label>ลิงก์ Google Maps (ถ้ามี)</label>
        <input type="url" id="inputMap" placeholder="https://maps.app.goo.gl/...">
      </div>
      <div class="form-group">
        <label>โน้ตย่อ / เมนูต้องลอง</label>
        <textarea id="inputNote" rows="2" placeholder="เช่น เปิดไฟ 19:00 น., ขนมเสี่ยวหลงเปาร้านดัง"></textarea>
      </div>
      <div class="form-group">
        <label>ชื่อผู้เพิ่ม</label>
        <input type="text" id="inputAddedBy" placeholder="เช่น เบนซ์">
      </div>

      <button class="btn-submit" id="btnSubmit" onclick="savePlace()">บันทึกข้อมูล</button>
      <button class="btn-submit" style="background:#E2E8F0; color:#333;" onclick="closeModal('entryModal')">ยกเลิก</button>
    </div>
  </div>

  <!-- Config Modal -->
  <div class="modal" id="configModal">
    <div class="modal-content">
      <div class="modal-title">ตั้งค่า Google Sheet API</div>
      <div class="form-group">
        <label>Google Apps Script Web App URL</label>
        <input type="text" id="scriptUrlInput">
      </div>
      <button class="btn-submit" onclick="saveConfig()">บันทึกการตั้งค่า</button>
      <button class="btn-submit" style="background:#E2E8F0; color:#333;" onclick="closeModal('configModal')">ปิด</button>
    </div>
  </div>

  <script>
    let allPlaces = [];
    let currentFilter = 'All';

    // ใส่ Web App URL ของคุณไว้ตรงนี้เป็นค่าเริ่มต้น
    function getApiUrl() {
      return localStorage.getItem('shanghai_script_url') || 'https://script.google.com/macros/library/d/1EdCEMluddpinKJakGFLk-6u_fg-LzSfo6waTAtYBHXHHzyQLTK6dCN_8/2';
    }

    async function loadPlaces() {
      const url = getApiUrl();
      const listEl = document.getElementById('placesList');

      if (!url || url.includes('ใส่_URL')) {
        listEl.innerHTML = `<div style="text-align:center; padding:40px 20px; color:var(--text-sub);">
          กรุณากดรูปเฟือง ⚙️ ด้านบน เพื่อใส่ <b>Google Apps Script URL</b> เพื่อเชื่อมต่อฐานข้อมูลครับ
        </div>`;
        return;
      }

      listEl.innerHTML = `<div style="text-align: center; color: var(--text-sub); padding: 40px 0;">กำลังโหลดข้อมูล...</div>`;

      try {
        const res = await fetch(url);
        allPlaces = await res.json();
        renderPlaces();
      } catch (err) {
        listEl.innerHTML = `<div style="text-align: center; color: red; padding: 40px 20px;">โหลดข้อมูลไม่สำเร็จ: ${err.message}</div>`;
      }
    }

    function filterDay(day, btn) {
      currentFilter = day;
      document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      renderPlaces();
    }

    function renderPlaces() {
      const listEl = document.getElementById('placesList');
      listEl.innerHTML = '';

      let filtered = allPlaces;
      if (currentFilter !== 'All') {
        filtered = allPlaces.filter(p => p.day === currentFilter);
      }

      if (filtered.length === 0) {
        listEl.innerHTML = `<div style="text-align:center; color:var(--text-sub); padding:40px 0;">ยังไม่มีสถานที่สำหรับช่วงนี้ กดปุ่มด้านล่างเพื่อเพิ่มได้เลย!</div>`;
        return;
      }

      const slots = ['ช่วงเช้า (Morning)', 'ช่วงบ่าย (Afternoon)', 'ช่วงค่ำ (Evening)'];
      
      slots.forEach(slot => {
        const inSlot = filtered.filter(p => p.timeSlot === slot);
        if (inSlot.length > 0) {
          const slotHeading = document.createElement('div');
          slotHeading.className = 'section-slot';
          slotHeading.innerText = `🕒 ${slot}`;
          listEl.appendChild(slotHeading);

          inSlot.forEach(place => {
            const card = document.createElement('div');
            card.className = `place-card ${place.visited ? 'is-done' : ''}`;
            
            // ลิงก์แผนที่ Amap (ค้นหาด้วยชื่อจีน หรือชื่ออังกฤษ)
            const searchQuery = encodeURIComponent((place.chineseName || place.placeName) + ' 上海');
            const amapUrl = `https://uri.amap.com/search?keyword=${searchQuery}`;
            const gmapUrl = place.mapUrl || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(place.placeName + ' Shanghai')}`;

            // ชื่อจีนพร้อมปุ่ม Copy
            const chineseBlock = place.chineseName 
              ? `<div class="chinese-tag" onclick="copyText('${place.chineseName}')" title="กดเพื่อคัดลอก">🇨🇳 ${place.chineseName} 📋</div>` 
              : '';

            // ข้อมูลสถานี Metro
            const metroBlock = place.metro 
              ? `<div class="metro-info">🚇 ${place.metro}</div>` 
              : '';

            card.innerHTML = `
              <div class="place-header">
                <div>
                  <span style="font-size:0.75rem; color:var(--primary); font-weight:600;">[${place.day}]</span>
                  <div class="place-name">${place.placeName}</div>
                </div>
                <span class="badge-user">${place.addedBy || 'เพื่อน'}</span>
              </div>
              
              ${chineseBlock}
              ${metroBlock}
              ${place.note ? `<div class="place-note">${place.note}</div>` : ''}

              <div class="place-actions">
                <a href="${gmapUrl}" target="_blank" class="btn-act btn-gmap">📍 Google Maps</a>
                <a href="${amapUrl}" target="_blank" class="btn-act btn-amap">🗺️ Amap (高德)</a>
                <button class="btn-act btn-edit" onclick="openEditModal(${place.rowIndex})">✏️</button>
                <button class="btn-act btn-delete" onclick="deletePlace(${place.rowIndex}, '${place.placeName}')">🗑️</button>
                <button class="btn-act btn-check" onclick="toggleVisited(${place.rowIndex}, ${!place.visited})">
                  ${place.visited ? '↩️ ยังไม่ไป' : '✅ ไปแล้ว'}
                </button>
              </div>
            `;
            listEl.appendChild(card);
          });
        }
      });
    }

    function copyText(txt) {
      navigator.clipboard.writeText(txt).then(() => {
        alert(`คัดลอก "${txt}" สำเร็จ! นำไปวางใน Didi หรือแอปแผนที่จีนได้เลย`);
      });
    }

    function openAddModal() {
      document.getElementById('modalHeading').innerText = 'เพิ่มสถานที่เที่ยวเซี่ยงไฮ้';
      document.getElementById('editRowIndex').value = '';
      document.getElementById('inputName').value = '';
      document.getElementById('inputChinese').value = '';
      document.getElementById('inputMetro').value = '';
      document.getElementById('inputMap').value = '';
      document.getElementById('inputNote').value = '';
      document.getElementById('entryModal').style.display = 'flex';
    }

    function openEditModal(rowIndex) {
      const place = allPlaces.find(p => p.rowIndex === rowIndex);
      if (!place) return;

      document.getElementById('modalHeading').innerText = 'แก้ไขข้อมูลสถานที่';
      document.getElementById('editRowIndex').value = place.rowIndex;
      document.getElementById('inputDay').value = place.day;
      document.getElementById('inputSlot').value = place.timeSlot;
      document.getElementById('inputName').value = place.placeName;
      document.getElementById('inputChinese').value = place.chineseName || '';
      document.getElementById('inputMetro').value = place.metro || '';
      document.getElementById('inputMap').value = place.mapUrl || '';
      document.getElementById('inputNote').value = place.note || '';
      document.getElementById('inputAddedBy').value = place.addedBy || '';

      document.getElementById('entryModal').style.display = 'flex';
    }

    async function savePlace() {
      const url = getApiUrl();
      if (!url) return alert('กรุณาตั้งค่า Script URL ก่อนครับ');

      const name = document.getElementById('inputName').value.trim();
      if (!name) return alert('กรุณากรอกชื่อสถานที่');

      const editRow = document.getElementById('editRowIndex').value;
      const isEdit = editRow !== '';

      const payload = {
        action: isEdit ? 'edit' : 'create',
        rowIndex: editRow,
        day: document.getElementById('inputDay').value,
        timeSlot: document.getElementById('inputSlot').value,
        placeName: name,
        chineseName: document.getElementById('inputChinese').value.trim(),
        metro: document.getElementById('inputMetro').value.trim(),
        mapUrl: document.getElementById('inputMap').value.trim(),
        note: document.getElementById('inputNote').value.trim(),
        addedBy: document.getElementById('inputAddedBy').value.trim() || 'เพื่อนในกลุ่ม'
      };

      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.innerText = 'กำลังบันทึก...';

      try {
        await fetch(url, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        alert(isEdit ? 'แก้ไขข้อมูลเรียบร้อยแล้ว!' : 'เพิ่มสถานที่สำเร็จแล้ว!');
        closeModal('entryModal');
        setTimeout(loadPlaces, 1200);
      } catch (err) {
        alert('เกิดข้อผิดพลาด: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = 'บันทึกข้อมูล';
      }
    }

    async function toggleVisited(rowIndex, newStatus) {
      const url = getApiUrl();
      try {
        // อัปเดตที่หน้าจอทันทีเพื่อความเร็ว
        const item = allPlaces.find(p => p.rowIndex === rowIndex);
        if (item) item.visited = newStatus;
        renderPlaces();

        // ส่งอัปเดตไป Google Sheet
        await fetch(url, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'toggleVisited',
            rowIndex: rowIndex,
            visited: newStatus
          })
        });
      } catch (err) {
        console.error(err);
      }
    }

    async function deletePlace(rowIndex, placeName) {
      if (!confirm(`ต้องการลบ "${placeName}" ออกใช่หรือไม่?`)) return;
      const url = getApiUrl();

      try {
        await fetch(url, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'delete',
            rowIndex: rowIndex
          })
        });

        alert('ลบสถานที่เรียบร้อยแล้ว');
        setTimeout(loadPlaces, 1200);
      } catch (err) {
        alert('เกิดข้อผิดพลาดในการลบ: ' + err.message);
      }
    }

    function openConfigModal() {
      document.getElementById('scriptUrlInput').value = getApiUrl();
      document.getElementById('configModal').style.display = 'flex';
    }

    function saveConfig() {
      const val = document.getElementById('scriptUrlInput').value.trim();
      localStorage.setItem('shanghai_script_url', val);
      closeModal('configModal');
      loadPlaces();
    }

    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    // Start
    loadPlaces();
  </script>
</body>
</html>
