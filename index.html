<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shanghai Super App 🇨🇳</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <style>
    :root {
      --bg: #090A0F;
      --card-bg: #13151D;
      --text-main: #F1F5F9;
      --text-sub: #94A3B8;
      --primary: #38BDF8;
      --primary-light: rgba(56, 189, 248, 0.12);
      --border: #222634;
      --radius: 14px;
      --danger: #F87171;
      --amap-blue: #38BDF8;
      --success: #34D399;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Prompt', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text-main); padding-bottom: 90px; }

    header {
      background: #0D0F17;
      padding: 16px 20px 10px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-top { display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.25rem; font-weight: 700; color: var(--primary); }
    .btn-config { background: none; border: none; font-size: 1.2rem; cursor: pointer; }

    /* Navigation Bar */
    .nav-tabs {
      display: flex;
      background: #0D0F17;
      border-bottom: 1px solid var(--border);
      padding: 6px 12px;
      gap: 6px;
    }
    .nav-btn {
      flex: 1;
      padding: 8px 4px;
      background: none;
      border: none;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-sub);
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .nav-btn.active {
      color: var(--primary);
      background: var(--primary-light);
      font-weight: 600;
    }

    /* Views */
    .view-content { display: none; padding: 16px 20px; }
    .view-content.active { display: block; }

    /* Filters */
    .filter-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; scrollbar-width: none; }
    .filter-scroll::-webkit-scrollbar { display: none; }
    .pill-btn {
      flex-shrink: 0;
      background: #13151D;
      border: 1px solid var(--border);
      color: var(--text-sub);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
    }
    .pill-btn.active {
      background: var(--primary);
      color: #090A0F;
      border-color: var(--primary);
      font-weight: 600;
    }

    /* Place Card */
    .place-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }
    .place-card.is-done {
      background: #0E1017;
      border-color: #1A1D28;
      opacity: 0.55;
    }
    .place-card.is-done .place-name { text-decoration: line-through; color: var(--text-sub); }

    .place-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 4px; }
    .place-name { font-size: 1.05rem; font-weight: 600; color: var(--text-main); }
    .badge-tag { font-size: 0.72rem; padding: 2px 8px; border-radius: 12px; font-weight: 500; background: #1E2230; color: var(--text-sub); }
    .badge-user { font-size: 0.7rem; color: var(--primary); background: var(--primary-light); padding: 2px 6px; border-radius: 6px; }

    .chinese-tag {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: #FCA5A5;
      font-size: 0.8rem; padding: 3px 8px;
      border-radius: 6px; margin: 4px 0 8px; cursor: pointer; font-weight: 500;
    }
    .metro-info {
      display: inline-flex; align-items: center; gap: 4px; font-size: 0.78rem;
      color: #7DD3FC; background: rgba(56, 189, 248, 0.1);
      padding: 3px 8px; border-radius: 6px; margin-bottom: 8px; font-weight: 500;
    }
    .place-note { font-size: 0.85rem; color: var(--text-sub); margin-bottom: 12px; line-height: 1.4; }

    .place-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .btn-act {
      padding: 7px 11px; border-radius: 8px; font-size: 0.76rem; font-weight: 500;
      text-decoration: none; display: inline-flex; align-items: center; gap: 4px; border: none; cursor: pointer;
    }
    .btn-gmap { background: #1E2230; color: #E2E8F0; }
    .btn-amap { background: rgba(56, 189, 248, 0.12); color: #38BDF8; }
    .btn-edit { background: rgba(245, 158, 11, 0.15); color: #FBBF24; }
    .btn-delete { background: rgba(239, 68, 68, 0.15); color: #F87171; }
    .btn-check { background: rgba(16, 185, 129, 0.15); color: #34D399; margin-left: auto; font-weight: 600; }
    .place-card.is-done .btn-check { background: #1E2230; color: #64748B; }

    /* Map Elements */
    #mapContainer { height: calc(100vh - 235px); width: 100%; border-radius: 14px; border: 1px solid var(--border); }
    .custom-map-pin {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #090A0F;
      font-weight: 700;
      font-size: 0.75rem;
      border: 2px solid #FFFFFF;
      box-shadow: 0 2px 8px rgba(0,0,0,0.7);
    }
    .leaflet-container { background: #F3F4F6 !important; }

    /* Calc & Phrases */
    .calc-card {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin-bottom: 16px;
    }
    .calc-input-group { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .calc-input-group input {
      flex: 1; padding: 12px; background: #090A0F; border: 1px solid var(--border); border-radius: 10px;
      font-size: 1.2rem; font-family: 'JetBrains Mono', monospace; font-weight: 600; outline: none; color: var(--text-main);
    }
    .calc-currency { font-weight: 600; width: 60px; font-size: 1rem; color: var(--text-sub); }

    .phrase-item {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 10px;
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
    }
    .phrase-cn { font-size: 1.15rem; font-weight: 600; color: #F87171; margin-bottom: 2px; }
    .phrase-py { font-size: 0.78rem; color: var(--text-sub); font-family: 'JetBrains Mono', monospace; }
    .phrase-th { font-size: 0.85rem; color: var(--text-main); margin-top: 2px; }

    /* FAB */
    .fab {
      position: fixed; bottom: 24px; right: 20px; background: var(--primary); color: #090A0F; border: none;
      padding: 14px 20px; border-radius: 30px; font-size: 0.95rem; font-weight: 600;
      box-shadow: 0 4px 16px rgba(56, 189, 248, 0.25); cursor: pointer; z-index: 99;
      display: flex; align-items: center; justify-content: center;
    }

    /* Modal Form */
    .modal {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7);
      display: none; align-items: flex-end; z-index: 1000;
    }
    .modal-content {
      background: #13151D; width: 100%; border-radius: 24px 24px 0 0; padding: 20px; max-height: 88vh; overflow-y: auto;
      border-top: 1px solid var(--border);
    }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--text-sub); margin-bottom: 4px; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 10px 12px; background: #090A0F; border: 1px solid var(--border); border-radius: 8px;
      font-size: 0.9rem; outline: none; color: var(--text-main);
    }
    .btn-submit {
      width: 100%; padding: 13px; background: var(--primary); color: #090A0F; border: none;
      border-radius: 10px; font-size: 0.95rem; font-weight: 600; margin-top: 8px; cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <div>
        <h1>Shanghai 2026 🇨🇳</h1>
        <div style="font-size: 0.72rem; color: var(--text-sub);">All-in-One Trip Assistant</div>
      </div>
      <button class="btn-config" onclick="openConfigModal()">⚙️</button>
    </div>
  </header>

  <!-- Navigation Bar -->
  <div class="nav-tabs">
    <button class="nav-btn active" onclick="switchView('itinerary', this)"><span>📋</span>แพลนเที่ยว</button>
    <button class="nav-btn" onclick="switchView('map', this)"><span>🗺️</span>แผนที่รวม</button>
    <button class="nav-btn" onclick="switchView('converter', this)"><span>💴</span>คำนวณเงิน</button>
    <button class="nav-btn" onclick="switchView('phrases', this)"><span>🗣️</span>ภาษาจีน</button>
  </div>

  <!-- VIEW 1: ITINERARY LIST -->
  <div id="view-itinerary" class="view-content active">
    <div class="filter-scroll" id="dayFilter">
      <button class="pill-btn active" onclick="filterDay('All', this)">ทั้งหมด</button>
      <button class="pill-btn" onclick="filterDay('Wishlist', this)">📌 Wishlist</button>
      <button class="pill-btn" onclick="filterDay('Day 1', this)">Day 1</button>
      <button class="pill-btn" onclick="filterDay('Day 2', this)">Day 2</button>
      <button class="pill-btn" onclick="filterDay('Day 3', this)">Day 3</button>
      <button class="pill-btn" onclick="filterDay('Day 4', this)">Day 4</button>
      <button class="pill-btn" onclick="filterDay('Day 5', this)">Day 5</button>
    </div>

    <div class="filter-scroll" id="catFilter">
      <button class="pill-btn active" onclick="filterCategory('All', this)">ทุกหมวด</button>
      <button class="pill-btn" onclick="filterCategory('🍜 ของกิน', this)">🍜 ของกิน</button>
      <button class="pill-btn" onclick="filterCategory('📸 Landmark', this)">📸 Landmark</button>
      <button class="pill-btn" onclick="filterCategory('🛍️ ช้อปปิ้ง', this)">🛍️ ช้อปปิ้ง</button>
      <button class="pill-btn" onclick="filterCategory('☕ คาเฟ่', this)">☕ คาเฟ่</button>
      <button class="pill-btn" onclick="filterCategory('🎢 เที่ยว/กิจกรรม', this)">🎢 เที่ยว/กิจกรรม</button>
    </div>

    <div id="placesList">
      <div style="text-align: center; color: var(--text-sub); padding: 40px 0;">กำลังโหลดข้อมูล...</div>
    </div>
  </div>

  <!-- VIEW 2: INTERACTIVE MAP (AMAP DIRECT TILES) -->
  <div id="view-map" class="view-content" style="padding: 12px 16px;">
    <div class="filter-scroll" id="mapDayFilter" style="margin-bottom: 8px;">
      <button class="pill-btn active" onclick="filterMapDay('All', this)">หมุดทั้งหมด</button>
      <button class="pill-btn" onclick="filterMapDay('Wishlist', this)">📌 Wishlist</button>
      <button class="pill-btn" onclick="filterMapDay('Day 1', this)">Day 1</button>
      <button class="pill-btn" onclick="filterMapDay('Day 2', this)">Day 2</button>
      <button class="pill-btn" onclick="filterMapDay('Day 3', this)">Day 3</button>
      <button class="pill-btn" onclick="filterMapDay('Day 4', this)">Day 4</button>
      <button class="pill-btn" onclick="filterMapDay('Day 5', this)">Day 5</button>
    </div>
    <div id="mapContainer"></div>
  </div>

  <!-- VIEW 3: CURRENCY CONVERTER -->
  <div id="view-converter" class="view-content">
    <div class="calc-card">
      <div style="font-size:0.85rem; color:var(--text-sub); margin-bottom:12px; display:flex; justify-content:space-between;">
        <span>เรทแปลงค่าเงิน</span>
        <span>1 CNY ≈ <input type="number" id="rateInput" value="5.00" step="0.05" style="width:65px; padding:2px 4px; text-align:center; background:#090A0F; color:#FFF; border:1px solid var(--border);" onchange="convertCNY()"> THB</span>
      </div>
      <div class="calc-input-group">
        <span class="calc-currency">CNY ¥</span>
        <input type="number" id="cnyInput" placeholder="0" oninput="convertCNY()">
      </div>
      <div style="text-align:center; color:var(--text-sub); margin:-4px 0 8px;">⇅</div>
      <div class="calc-input-group">
        <span class="calc-currency">THB ฿</span>
        <input type="number" id="thbInput" placeholder="0" oninput="convertTHB()">
      </div>
    </div>
  </div>

  <!-- VIEW 4: SURVIVAL CHINESE -->
  <div id="view-phrases" class="view-content">
    <div style="font-size:0.85rem; color:var(--text-sub); margin-bottom:12px;">แตะที่การ์ดเพื่อคัดลอก</div>
    <div id="phrasesList"></div>
  </div>

  <!-- FAB -->
  <button class="fab" id="fabAdd" onclick="openAddModal()">+ เพิ่มสถานที่</button>

  <!-- Modal: Add/Edit Place -->
  <div class="modal" id="entryModal">
    <div class="modal-content">
      <div style="font-size:1.15rem; font-weight:600; margin-bottom:14px; color:var(--text-main);" id="modalHeading">เพิ่มสถานที่เที่ยว</div>
      <input type="hidden" id="editRowIndex" value="">

      <div class="form-group">
        <label>⚡ ดึงข้อมูลจาก Landmark ยอดฮิต (ถ้าต้องการ)</label>
        <select id="presetSelector" onchange="applyPreset(this.value)">
          <option value="">-- พิมพ์เองอิสระ --</option>
        </select>
      </div>

      <div class="form-group">
        <label>ชื่อสถานที่</label>
        <input type="text" id="inputName" placeholder="เช่น ร้านอาหาร, คาเฟ่, ห้าง">
      </div>

      <div class="form-group">
        <label>วันที่</label>
        <select id="inputDay">
          <option value="Wishlist">📌 ยังไม่ระบุวัน (Wishlist / กองไว้ก่อน)</option>
          <option value="Day 1">Day 1</option>
          <option value="Day 2">Day 2</option>
          <option value="Day 3">Day 3</option>
          <option value="Day 4">Day 4</option>
          <option value="Day 5">Day 5</option>
        </select>
      </div>

      <div class="form-group">
        <label>ช่วงเวลา</label>
        <select id="inputSlot">
          <option value="ช่วงเช้า (Morning)">ช่วงเช้า (Morning)</option>
          <option value="ช่วงบ่าย (Afternoon)">ช่วงบ่าย (Afternoon)</option>
          <option value="ช่วงค่ำ (Evening)">ช่วงค่ำ (Evening)</option>
          <option value="ยังไม่ระบุเวลา">ยืดหยุ่น / ยังไม่กำหนดเวลา</option>
        </select>
      </div>

      <div class="form-group">
        <label>หมวดหมู่</label>
        <select id="inputCat">
          <option value="📸 Landmark">📸 Landmark / จุดถ่ายรูป</option>
          <option value="🍜 ของกิน">🍜 ของกิน / อาหาร</option>
          <option value="☕ คาเฟ่">☕ คาเฟ่ / เครื่องดื่ม</option>
          <option value="🛍️ ช้อปปิ้ง">🛍️ ช้อปปิ้ง</option>
          <option value="🎢 เที่ยว/กิจกรรม">🎢 เที่ยว / กิจกรรม</option>
        </select>
      </div>

      <div class="form-group">
        <label>ชื่อภาษาจีน (สำหรับ Didi / Amap)</label>
        <div style="display:flex; gap:6px;">
          <input type="text" id="inputChinese" placeholder="เช่น 全季酒店(上海外滩金陵东路店)">
          <button type="button" style="background:var(--primary); color:#090A0F; border:none; padding:0 10px; border-radius:8px; font-weight:600; font-size:0.75rem; white-space:nowrap;" onclick="searchCoordsByChinese()">🔍 ดึงพิกัด</button>
        </div>
      </div>

      <div class="form-group">
        <label>สถานีรถไฟใต้ดิน (Metro Exit)</label>
        <input type="text" id="inputMetro" placeholder="เช่น Line 14 - Yuyuan Station Exit 5">
      </div>

      <div class="form-group">
        <label>พิกัด หรือ ลิงก์แผนที่</label>
        <input type="text" id="inputMap" placeholder="วางลิงก์ Amap, ลิงก์ Google หรือเลขพิกัด 31.xx, 121.xx">
      </div>

      <div class="form-group">
        <label>โน้ตย่อ / เมนูแนะนำ</label>
        <textarea id="inputNote" rows="2" placeholder="เช่น จุดถ่ายรูปไฟเปิด 19:00"></textarea>
      </div>

      <div class="form-group">
        <label>ชื่อผู้เพิ่ม</label>
        <input type="text" id="inputAddedBy" placeholder="เช่น เบนซ์">
      </div>

      <button class="btn-submit" id="btnSubmit" onclick="savePlace()">บันทึกข้อมูล</button>
      <button class="btn-submit" style="background:#1E2230; color:var(--text-sub);" onclick="closeModal('entryModal')">ยกเลิก</button>
    </div>
  </div>

  <!-- Config Modal -->
  <div class="modal" id="configModal">
    <div class="modal-content">
      <div style="font-size:1.15rem; font-weight:600; margin-bottom:14px; color:var(--text-main);">ตั้งค่าระบบ</div>
      <div class="form-group">
        <label>Google Apps Script URL</label>
        <input type="text" id="scriptUrlInput">
      </div>
      <button class="btn-submit" onclick="saveConfig()">บันทึก</button>
      <button class="btn-submit" style="background:#1E2230; color:var(--text-sub);" onclick="closeModal('configModal')">ปิด</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script>
    let allPlaces = [];
    let currentDayFilter = 'All';
    let currentCatFilter = 'All';
    let currentMapDayFilter = 'All';
    let mapInstance = null;
    let markersLayer = null;

    const dayColors = {
      'Wishlist': '#A855F7',
      'Day 1': '#38BDF8',
      'Day 2': '#FB923C',
      'Day 3': '#4ADE80',
      'Day 4': '#F472B6',
      'Day 5': '#FACC15'
    };

    const landmarkDatabase = [
      { name: "The Bund", matchTerms: ["the bund", "bund", "外滩", "ไว่ทาน", "เดอะบันด์", "หาดไว่ทาน"], cn: "外滩", metro: "Line 2/10 - East Nanjing Rd. Exit 7", cat: "📸 Landmark", coords: [31.2383, 121.4905] },
      { name: "Yu Garden", matchTerms: ["yu garden", "yuyuan", "豫园", "อวี้หยวน", "สวนอวี้หยวน"], cn: "豫园", metro: "Line 10/14 - Yuyuan Station Exit 1", cat: "📸 Landmark", coords: [31.2268, 121.4925] },
      { name: "Oriental Pearl Tower", matchTerms: ["oriental pearl", "หอไข่มุก", "东方明珠"], cn: "东方明珠广播电视塔", metro: "Line 2 - Lujiazui Exit 1", cat: "📸 Landmark", coords: [31.2397, 121.4998] },
      { name: "Shanghai Tower", matchTerms: ["shanghai tower", "เซี่ยงไฮ้ทาวเวอร์", "上海中心"], cn: "上海中心大厦", metro: "Line 2/14 - Lujiazui Exit 9", cat: "📸 Landmark", coords: [31.2355, 121.5015] },
      { name: "Nanjing Road", matchTerms: ["nanjing road", "นานจิง", "南京路", "ถนนนานจิง"], cn: "南京东路步行街", metro: "Line 2/10 - East Nanjing Rd. Exit 1/4", cat: "🛍️ ช้อปปิ้ง", coords: [31.2359, 121.4789] },
      { name: "Shanghai Disneyland", matchTerms: ["disneyland", "disney", "ดิสนีย์แลนด์", "迪士尼"], cn: "上海迪士尼度假区", metro: "Line 11 - Disney Resort Exit 1", cat: "🎢 เที่ยว/กิจกรรม", coords: [31.1440, 121.6570] },
      { name: "Starbucks Reserve Roastery", matchTerms: ["starbucks reserve", "สตาร์บัคส์", "星巴克"], cn: "星巴克臻选上海烘焙工坊", metro: "Line 2/12/13 - West Nanjing Rd. Exit 11", cat: "☕ คาเฟ่", coords: [31.2312, 121.4604] },
      { name: "Xintiandi", matchTerms: ["xintiandi", "ซินเทียนตี้", "新天地"], cn: "新天地", metro: "Line 10/13 - Xintiandi Exit 6", cat: "🛍️ ช้อปปิ้ง", coords: [31.2186, 121.4754] },

    async function searchCoordsByChinese() {
      const cnName = document.getElementById('inputChinese').value.trim();
      if (!cnName) return alert('กรุณากรอกชื่อภาษาจีนก่อนกดดึงพิกัดครับ');
      
      const btn = event.target;
      const originalText = btn.innerText;
      btn.innerText = '⏳ ค้นหา...';

      try {
        // ใช้ Amap Web Service Geocode ดึงพิกัดเมืองเซี่ยงไฮ้
        const res = await fetch(`https://restapi.amap.com/v3/geocode/geo?key=8325164e247e15eea68b59e89200988b&address=${encodeURIComponent(cnName)}&city=上海`);
        const data = await res.json();
        if (data.status === '1' && data.geocodes && data.geocodes.length > 0) {
          const loc = data.geocodes[0].location; // คืนค่า "lng,lat"
          const parts = loc.split(',');

        }

      } finally {
        btn.innerText = originalText;
      }
    }

    function extractCoordsFromUrl(url) {
      if (!url) return null;
      try {
        url = url.trim();

        // 1. ตรวจสอบพิกัดตัวเลขตรงๆ เช่น 31.2295, 121.4878
        const rawPairMatch = url.match(/^(-?\d+\.\d+)[,\s]+(-?\d+\.\d+)$/);
        if (rawPairMatch) {
          let p1 = parseFloat(rawPairMatch[1]);
          let p2 = parseFloat(rawPairMatch[2]);
          if (p1 > 100 && p2 < 50) return [p2, p1];
          return [p1, p2];
        }

        // 2. ดักกรณีวางลิงก์ Amap เว็บแบบมี center/location
        const amapMatch = url.match(/[?&](?:center|location)=(-?\d+\.\d+),(-?\d+\.\d+)/);
        if (amapMatch) {
          let lng = parseFloat(amapMatch[1]);
          let lat = parseFloat(amapMatch[2]);
          return [lat, lng];
        }

        // 3. ตรวจสอบลิงก์ Google Maps แบบยาว
        const gmapMatch = url.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) || url.match(/q=(-?\d+\.\d+),(-?\d+\.\d+)/);
        if (gmapMatch) {
          return [parseFloat(gmapMatch[1]), parseFloat(gmapMatch[2])];
        }
      } catch (err) {
        console.error("Coords parse error", err);
      }
      return null;
    }

    function renderPlaces() {
      const listEl = document.getElementById('placesList');
      if (!listEl) return;
      listEl.innerHTML = '';

      let filtered = allPlaces;
      if (currentDayFilter !== 'All') filtered = filtered.filter(p => (p.day || 'Wishlist') === currentDayFilter);
      if (currentCatFilter !== 'All') filtered = filtered.filter(p => (p.category || '📸 Landmark') === currentCatFilter);

      if (filtered.length === 0) {
        listEl.innerHTML = '<div style="text-align:center; color:var(--text-sub); padding:40px 0;">ไม่พบสถานที่ในหมวดนี้ กด + เพื่อเพิ่มได้เลย</div>';
        return;
      }

      const slots = ['ช่วงเช้า (Morning)', 'ช่วงบ่าย (Afternoon)', 'ช่วงค่ำ (Evening)', 'ยังไม่ระบุเวลา'];
      slots.forEach(slot => {
        const inSlot = filtered.filter(p => (p.timeSlot || 'ช่วงเช้า (Morning)') === slot);
        if (inSlot.length > 0) {
          const heading = document.createElement('div');
          heading.style = 'margin: 14px 0 6px; font-size: 0.88rem; font-weight: 600; color: var(--text-sub);';
          heading.innerText = '🕒 ' + slot;
          listEl.appendChild(heading);

          inSlot.forEach(place => {
            const card = document.createElement('div');
            card.className = 'place-card ' + (place.visited ? 'is-done' : '');

            const gmapUrl = place.mapUrl || ('https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(place.placeName + ' Shanghai'));
            const amapUrl = 'https://uri.amap.com/search?keyword=' + encodeURIComponent((place.chineseName || place.placeName) + ' 上海');

            card.innerHTML = `
              <div class="place-header">
                <div>
                  <div style="display:flex; align-items:center; gap:6px; margin-bottom:2px;">
                    <span class="badge-tag">${place.category || '📸 Landmark'}</span>
                    <span style="font-size:0.75rem; color:${dayColors[place.day] || 'var(--primary)'}; font-weight:600;">[${place.day || 'Wishlist'}]</span>
                  </div>
                  <div class="place-name">${place.placeName}</div>
                </div>
                <span class="badge-user">${place.addedBy || 'เพื่อน'}</span>
              </div>

              ${place.chineseName ? `<div class="chinese-tag" onclick="copyText('${place.chineseName}')">🇨🇳 ${place.chineseName} 📋</div>` : ''}
              ${place.metro ? `<div class="metro-info">🚇 ${place.metro}</div>` : ''}
              ${place.note ? `<div class="place-note">${place.note}</div>` : ''}

              <div class="place-actions">
                <a href="${gmapUrl}" target="_blank" class="btn-act btn-gmap">📍 G-Maps</a>
                <a href="${amapUrl}" target="_blank" class="btn-act btn-amap">🗺️ Amap</a>
                <button class="btn-act btn-edit" onclick="openEditModal(${place.rowIndex})">✏️</button>
                <button class="btn-act btn-delete" onclick="deletePlace(${place.rowIndex}, '${place.placeName}')">🗑️</button>
                <button class="btn-act btn-check" onclick="toggleVisited(${place.rowIndex}, ${!place.visited})">
                  ${place.visited ? '↩️ ยังไม่ไป' : '✅ ไปแล้ว'}

    function initMap() {
      if (!mapInstance) {
        try {
          mapInstance = L.map('mapContainer').setView([31.2383, 121.4905], 13);
          L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
            subdomains: ['1', '2', '3', '4'],
            attribution: '© AutoNavi (高德地图)',
            maxZoom: 18,
            minZoom: 4
          }).addTo(mapInstance);

          markersLayer = L.layerGroup().addTo(mapInstance);
        } catch(e) {
          console.error("Map init error", e);
        }
      }
      setTimeout(() => {
        if (mapInstance) {
          mapInstance.invalidateSize();
          updateMapMarkers();
        }
      }, 200);
    }

    function filterMapDay(day, btn) {
      currentMapDayFilter = day;
      document.querySelectorAll('#mapDayFilter .pill-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      updateMapMarkers();
    }

    function updateMapMarkers() {
      if (!markersLayer || !mapInstance) return;
      markersLayer.clearLayers();

      let placesToMap = allPlaces;
      if (currentMapDayFilter !== 'All') {
        placesToMap = placesToMap.filter(p => (p.day || 'Wishlist') === currentMapDayFilter);
      }

      const bounds = [];

      placesToMap.forEach((p) => {
        let coord = null;
        const pName = (p.placeName || '').trim().toLowerCase();
        const pCn = (p.chineseName || '').trim();

        // 1. ให้ความสำคัญสูงสุดกับพิกัดที่ระบุมาในช่อง mapUrl
        if (p.mapUrl) {
          coord = extractCoordsFromUrl(p.mapUrl);
        }

        // 2. ถ้าไม่มี ให้ดึงจาก Landmark Database
        if (!coord) {
          const found = landmarkDatabase.find(lm => {
            return lm.matchTerms.some(term => pName === term.toLowerCase() || pName.startsWith(term.toLowerCase())) || 
                   (pCn && lm.cn === pCn);
          });

          if (found) {
            coord = found.coords;
            if (!p.chineseName) p.chineseName = found.cn;
            if (!p.metro) p.metro = found.metro;
          }
        }

        if (!coord) return;

        bounds.push(coord);

        const pinColor = dayColors[p.day] || '#38BDF8';
        const dayLabel = (p.day === 'Wishlist') ? '📌' : (p.day || 'D1').replace('Day ', 'D');

        const customIcon = L.divIcon({
          className: 'custom-icon-wrapper',
          html: `<div class="custom-map-pin" style="background-color: ${pinColor};">${dayLabel}</div>`,
          iconSize: [28, 28],
          iconAnchor: [14, 14]
        });

        const marker = L.marker(coord, { icon: customIcon }).addTo(markersLayer);
        const amapUrl = 'https://uri.amap.com/search?keyword=' + encodeURIComponent((p.chineseName || p.placeName) + ' 上海');

        marker.bindPopup(`
          <div style="font-family:'Prompt',sans-serif; min-width:140px; color:#1E293B;">
            <b style="color:${pinColor};">[${p.day || 'Wishlist'}]</b> <b>${p.placeName}</b><br>
            <span style="color:#991B1B;">${p.chineseName || ''}</span><br>
            <small style="color:#0284C7;">🚇 ${p.metro || '-'}</small><br>
            <a href="${amapUrl}" target="_blank" style="display:inline-block; margin-top:4px; color:#0284C7; font-weight:600;">เปิดใน Amap ➔</a>
          </div>
        `);
      });

      if (bounds.length > 0) {
        mapInstance.fitBounds(bounds, { padding: [40, 40], maxZoom: 15 });
      }
    }

    async function savePlace() {
      const url = getApiUrl();
      if (!url) return alert('กรุณาตั้งค่า Script URL ในปุ่มเฟืองก่อนครับ');

      const name = document.getElementById('inputName').value.trim();
      if (!name) return alert('กรุณาระบุชื่อสถานที่');

      const editRow = document.getElementById('editRowIndex').value;
      const isEdit = editRow !== '';

      const payload = {
        action: isEdit ? 'edit' : 'create',
        rowIndex: editRow,
        category: document.getElementById('inputCat').value,
        day: document.getElementById('inputDay').value,
        timeSlot: document.getElementById('inputSlot').value,
        placeName: name,
        chineseName: document.getElementById('inputChinese').value.trim(),
        metro: document.getElementById('inputMetro').value.trim(),
        mapUrl: document.getElementById('inputMap').value.trim(),
        note: document.getElementById('inputNote').value.trim(),
        addedBy: document.getElementById('inputAddedBy').value.trim() || 'เพื่อนในกลุ่ม'
      };

      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.innerText = 'กำลังบันทึก...';

      try {
        await fetch(url, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        closeModal('entryModal');
        setTimeout(loadPlaces, 1200);
      } catch (e) {
        alert('เกิดข้อผิดพลาด: ' + e.message);
      } finally {
        btn.disabled = false;
        btn.innerText = 'บันทึกข้อมูล';
      }
    }

    async function toggleVisited(rowIndex, newStatus) {
      const p = allPlaces.find(x => x.rowIndex === rowIndex);
      if (p) p.visited = newStatus;
      renderPlaces();

      const url = getApiUrl();
      if (!url) return;

      await fetch(url, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'toggleVisited', rowIndex: rowIndex, visited: newStatus })
      });
    }

    async function deletePlace(rowIndex, name) {
      if (!confirm('ต้องการลบ "' + name + '" ใช่หรือไม่?')) return;
      const url = getApiUrl();
      if (!url) return;
      await fetch(url, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'delete', rowIndex: rowIndex })
      });
      setTimeout(loadPlaces, 1200);
    }
